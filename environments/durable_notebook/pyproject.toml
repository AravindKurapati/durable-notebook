[project]
name = "durable-notebook"
description = "Multi-turn RL environment where facts are compacted out of context, forcing filesystem persistence; naive (hackable) and hardened graders for studying reward hacking."
version = "0.1.3"
tags = ["rl", "reward-hacking", "memory", "agentic", "train"]
requires-python = ">=3.10"
dependencies = ["verifiers>=0.3.0", "datasets>=2.19"]

[project.optional-dependencies]
dev = ["pytest>=8", "openai>=1.40", "python-dotenv>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["durable_notebook/**", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["durable_notebook"]

[tool.verifiers.eval]
model = "gpt-4.1-mini"
